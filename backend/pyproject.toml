[project]
name = "screening-bridge"
version = "0.1.0"
description = "Discovery contract and live Qloo coverage probe for Screening Bridge"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.137,<1",
    "httpx>=0.28,<1",
    "pydantic>=2.13,<3",
    "uvicorn>=0.49,<1",
]

[dependency-groups]
dev = [
    "mypy>=1.19,<2",
    "pytest>=9,<10",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
